# Render Blueprint: one web service (app + API) and one Postgres database.
services:
  - type: web
    name: claude-code-academy
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAINS
        value: concret.io
      - key: DATABASE_URL
        fromDatabase:
          name: academy-db
          property: connectionString

databases:
  - name: academy-db
    plan: free
